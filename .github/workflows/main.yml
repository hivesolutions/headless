name: Main Workflow
on: [push]
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    runs-on: ubuntu-latest
    container: node:${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - run: >-
          if grep -qs bullseye /etc/apt/sources.list; then
          sed -i "s/deb.debian.org/archive.debian.org/g" /etc/apt/sources.list; fi
      - run: >-
          apt-get update && apt-get install -y wget gnupg bzip2\
            libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1\
            libfontconfig1 libgcc1 libgdk-pixbuf-2.0-0 libglib2.0-0\
            libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6\
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1\
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6\
            libgbm-dev ca-certificates fonts-liberation \
            ttf-wqy-zenhei fonts-wqy-microhei fonts-arphic-ukai fonts-noto-cjk fonts-arphic-uming\
            libnss3 lsb-release xdg-utils
      - run: node --version
      - run: npm install
      - run: npm install --only=dev
      - run: npm run lint
      - run: node node_modules/puppeteer/install.mjs
      - run: npm test
  build-bun:
    name: Build Bun
    timeout-minutes: 10
    strategy:
      matrix:
        bun-version: ["1.1", "1.2", "1.3", "1.4", "latest"]
    runs-on: ubuntu-latest
    container: oven/bun:${{ matrix.bun-version }}
    steps:
      - uses: actions/checkout@v4
      - run: >-
          if grep -qs bullseye /etc/apt/sources.list; then
          sed -i "s/deb.debian.org/archive.debian.org/g" /etc/apt/sources.list; fi
      - run: >-
          apt-get update && apt-get install -y wget gnupg bzip2\
            libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1\
            libfontconfig1 libgcc1 libgdk-pixbuf-2.0-0 libglib2.0-0\
            libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6\
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1\
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6\
            libgbm-dev ca-certificates fonts-liberation \
            ttf-wqy-zenhei fonts-wqy-microhei fonts-arphic-ukai fonts-noto-cjk fonts-arphic-uming\
            libnss3 lsb-release xdg-utils
      - run: bun --version
      - run: bun install
      - run: bun run lint
      - run: bun node_modules/puppeteer/install.mjs
      - run: bun run test
